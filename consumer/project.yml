name: SwiftPackageExportRepro
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
packages:
  ExportedPackage:
    path: ../shared/SwiftPackage/Release
targets:
  SwiftPackageExportRepro:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.swiftpackageexportrepro
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: ExportedPackage
        product: ComposablesLibrary
schemes:
  SwiftPackageExportRepro:
    build:
      targets:
        SwiftPackageExportRepro: all
    run:
      config: Debug
    archive:
      config: Release
